spring.datasource.url=jdbc:postgresql://db:5432/counterdb
spring.datasource.username=user
spring.datasource.password=password
spring.datasource.driver-class-name=org.postgresql.Driver

# Exécute les scripts SQL au démarrage
#spring.sql.init.mode=ALWAYS
#spring.sql.init.schema-locations=classpath:schema.sql
#spring.sql.init.data-locations=classpath:data.sql

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update

spring.security.oauth2.client.registration.github.client-id=TON_CLIENT_ID
spring.security.oauth2.client.registration.github.client-secret=TON_CLIENT_SECRET
spring.security.oauth2.client.registration.github.scope=read:user,user:email

